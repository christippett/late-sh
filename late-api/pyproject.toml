[project]
name = "late-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Chris Tippett", email = "git@christippett.dev" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "pexpect>=4.9.0",
    "uvicorn>=0.52.4",
]

[project.scripts]
late-api = "late_api:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.ruff.lint]
ignore = ["BLE001"]
